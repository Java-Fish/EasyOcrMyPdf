[project]
name = "ocrmypdf-gui"
version = "0.0.2"
description = "Einsteigerfreundliche Oberfläche für OCRmyPDF und Tesseract"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "ocrmypdf>=16",
    "certifi",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.6",
    "Pillow>=10",
]

[project.gui-scripts]
ocrmypdf-gui = "ocrmypdf_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ocrmypdf_gui", "ocrmypdf_gui.ui"]
