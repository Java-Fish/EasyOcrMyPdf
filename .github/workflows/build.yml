# Baut EasyOcrMyPdf für Windows, macOS (Apple Silicon) und Linux (x86_64 und
# arm64), prüft jedes Paket mit einer echten Texterkennung und hängt die
# Ergebnisse bei einem Versions-Tag (v1.2.3) an ein GitHub-Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Sprachmodelle, die zusätzlich zu Englisch eingebettet werden. Homebrew und
  # das Windows-Installationsprogramm bringen von sich aus nur Englisch mit.
  TESSDATA_URL: https://github.com/tesseract-ocr/tessdata_fast/raw/main

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tesseract, Ghostscript and optimisers
        run: |
          brew install tesseract ghostscript pngquant jbig2enc
          curl -fsSL -o "$(brew --prefix)/share/tessdata/deu.traineddata" "$TESSDATA_URL/deu.traineddata"

      - name: Build
        run: |
          python -m venv .venv
          ./packaging/build_macos.sh --vendor --dmg

      - name: Smoke test
        run: .venv/bin/python tools/smoke_test.py "dist/EasyOcrMyPdf.app/Contents/MacOS/EasyOcrMyPdf"

      - name: Collect artifacts
        run: |
          mkdir upload
          cp dist/EasyOcrMyPdf.dmg upload/EasyOcrMyPdf-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: upload/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tesseract, Ghostscript and Inno Setup
        shell: pwsh
        run: |
          choco install -y --no-progress tesseract ghostscript innosetup
          Invoke-WebRequest "$env:TESSDATA_URL/deu.traineddata" `
            -OutFile "C:\Program Files\Tesseract-OCR\tessdata\deu.traineddata"

      - name: Build
        shell: pwsh
        run: .\packaging\build_windows.ps1 -Vendor -Installer

      - name: Smoke test
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\smoke_test.py "dist\EasyOcrMyPdf\EasyOcrMyPdf.exe"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory upload | Out-Null
          Copy-Item dist\EasyOcrMyPdf-Setup.exe upload\EasyOcrMyPdf-windows-x64-Setup.exe
          Compress-Archive -Path dist\EasyOcrMyPdf -DestinationPath upload\EasyOcrMyPdf-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: upload/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Gebaut wird im Container auf Ubuntu 22.04, damit das Ergebnis dank der
      # älteren glibc auch auf Debian 12 und RHEL 9 läuft.
      - name: Build the build image
        run: |
          docker build --build-arg "APPIMAGETOOL_ARCH=${{ matrix.arch }}" \
            -f packaging/Dockerfile.linux -t easyocrmypdf-build .

      - name: Build and smoke test
        run: |
          docker run --rm -v "$PWD:/projekt" easyocrmypdf-build bash -c '
            set -e
            ./packaging/build_linux.sh --vendor --appimage
            "$VENV/bin/python" tools/smoke_test.py dist/easyocrmypdf/easyocrmypdf
          '

      - name: Collect artifacts
        run: |
          mkdir upload
          cp dist/EasyOcrMyPdf-linux-${{ matrix.arch }}.tar.gz upload/
          cp dist/EasyOcrMyPdf-${{ matrix.arch }}.AppImage upload/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EasyOcrMyPdf ${GITHUB_REF_NAME#v}" \
            --generate-notes

  # Trägt eine neue Version im Homebrew-Tap und bei winget ein. Braucht das
  # Secret PACKAGING_TOKEN (klassischer Token mit "public_repo"); ohne es wird
  # der Job übersprungen. Die erste winget-Version muss bereits von Hand
  # aufgenommen worden sein, danach reicht winget-releaser Updates selbst ein.
  packages:
    name: Homebrew and winget
    needs: release
    runs-on: ubuntu-24.04
    env:
      PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
      TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$PACKAGING_TOKEN" ]; then
            echo "::notice::PACKAGING_TOKEN is not set - skipping Homebrew and winget."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew cask
        if: steps.token.outputs.available == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/EasyOcrMyPdf-macos-arm64.dmg"
          SHA256="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"
          git clone "https://x-access-token:$PACKAGING_TOKEN@github.com/$TAP_REPO.git" tap
          cd tap
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/easyocrmypdf.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "easyocrmypdf $VERSION"
          git push

      - name: Submit to winget
        if: steps.token.outputs.available == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: JavaFish.EasyOcrMyPdf
          installers-regex: 'windows-x64-Setup\.exe$'
          fork-user: ${{ github.repository_owner }}
          token: ${{ secrets.PACKAGING_TOKEN }}
